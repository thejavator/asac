# VM deployment: portal + daemon + Postgres. Put your TLS reverse proxy in front of the portal.
# Copy .env.example to .env and fill it in. Nothing here is specific to a vendor.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: asac
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: asac
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asac"]
      interval: 5s
      retries: 10

  portal:
    build: .
    # The project is mounted read-only, so the portal keeps its own data in the state volume, and
    # registers the mounted project at startup (otherwise it opens empty).
    command:
      - portal
      - "--host=0.0.0.0"
      - "--port=8080"
      - "--data=/state/portal"
      - "--project=${ASAC_PROJECT_ID:-default}=/project/asac.yaml"
    environment: &env
      ASAC_STATE_URL: postgresql://asac:${POSTGRES_PASSWORD}@postgres:5432/asac
      ASAC_STATE_DIR: /state
      ASAC_OIDC_ISSUER: ${ASAC_OIDC_ISSUER:?set ASAC_OIDC_ISSUER}
      ASAC_OIDC_CLIENT_ID: ${ASAC_OIDC_CLIENT_ID:?set ASAC_OIDC_CLIENT_ID}
      ASAC_OIDC_CLIENT_SECRET: ${ASAC_OIDC_CLIENT_SECRET:-}
      ASAC_OIDC_REDIRECT_URI: ${ASAC_OIDC_REDIRECT_URI:?set ASAC_OIDC_REDIRECT_URI}
      ASAC_OIDC_ROLES_CLAIM: ${ASAC_OIDC_ROLES_CLAIM:-roles}
      ASAC_NOTIFY: ${ASAC_NOTIFY:-}
    volumes:
      - ${ASAC_PROJECT:-./examples/payments-service}:/project:ro
      - state:/state
    ports: ["127.0.0.1:${ASAC_PORTAL_PORT:-8080}:8080"]
    depends_on: { postgres: { condition: service_healthy } }
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  daemon:
    build: .
    command: ["daemon", "--host", "0.0.0.0", "--port", "8090"]
    environment:
      <<: *env
      ASAC_WEBHOOK_SECRET: ${ASAC_WEBHOOK_SECRET:?set ASAC_WEBHOOK_SECRET}
    volumes:
      - ${ASAC_PROJECT:-./examples/payments-service}:/project
      - state:/state
    ports: ["127.0.0.1:${ASAC_DAEMON_PORT:-8090}:8090"]
    depends_on: { postgres: { condition: service_healthy } }
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

volumes:
  pgdata: {}
  state: {}
